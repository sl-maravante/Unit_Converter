<html>
    <head>
        <link rel="stylesheet" href="index.css"/>
    </head>
    <body>
        <div id="container">
            <div class="main">
                <h1>Metric/Imperial Unit Conversion</h1>
                <input id="input-btn" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Enter a Number"/>
                <button id="convertBtn">Convert</button>
            </div>
           <div class="section">
            <div class="metric">
                <h3>Length (Meter/Feet)</h3>
                <p id="lengthMetric">0 meters = 0.000 feet | 0 feet = 0.000 meters</p>
            </div>
            <div class="metric">
                <h3>Volume (Liters/Gallon)</h3>
                <p id="volumeMetric">0 meters = 0.000 feet | 0 feet = 0.000 meters</p>
            </div>
            <div class="metric">
                <h3>Mass (Kilograms/pounds)</h3>
                <p id="massMetric">0 meters = 0.000 feet | 0 feet = 0.000 meters</p>
            </div>
        </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
